name: 시세 수집 후 사이트 갱신

# 컴퓨터를 켜 두지 않아도 클라우드가 대신 수집하고, 핸드폰은 주소만 열면 되게 한다.
on:
  schedule:
    # UTC 기준이다. 한국시간 오전 9시 / 오후 9시 (KST = UTC+9)
    - cron: "0 0,12 * * *"
  workflow_dispatch:        # 원할 때 손으로 실행
  push:
    branches: [main]
    paths:
      - "pokewatch/**"
      - ".github/workflows/collect.yml"

permissions:
  contents: write   # 수집 로그를 저장소에 남기기 위해

# 앞 실행이 끝나지 않았으면 기다린다 (DB 커밋이 겹치지 않게)
concurrency:
  group: pokewatch-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      cf_deployed: ${{ steps.cf.outputs.deployed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 지난 실행에서 쌓아 둔 시세 DB를 복원한다. 이게 있어야 가격 '추이'가 이어진다.
      - name: 이전 시세 DB 복원
        uses: actions/cache/restore@v4
        with:
          path: data
          key: pokewatch-db-${{ github.run_id }}
          restore-keys: |
            pokewatch-db-

      # 카페 목록에는 비밀이 없다(공개 카페 주소일 뿐). 그래서 저장소의 cafes.json 을
      # 우선 쓴다. 그래야 카페를 바꿀 때 시크릿을 건드리지 않고 파일만 고치면 된다.
      # 로그인 쿠키는 별도 시크릿(POKEWATCH_COOKIE)이라 여기 섞이지 않는다.
      - name: 설정 파일 준비
        env:
          POKEWATCH_CONFIG_JSON: ${{ secrets.POKEWATCH_CONFIG_JSON }}
        run: |
          if [ -f cafes.json ]; then
            cp cafes.json config.json
            echo "저장소의 cafes.json 을 사용합니다."
          elif [ -n "$POKEWATCH_CONFIG_JSON" ]; then
            printf '%s' "$POKEWATCH_CONFIG_JSON" > config.json
            echo "저장소 시크릿의 설정을 사용합니다."
          else
            echo "::warning::설정이 없어 예제 데이터로 사이트를 만듭니다."
          fi
          echo "수집할 카페:"
          python3 -c "import json;[print(' -',c.get('name'),'|',c.get('cafe_url') or c.get('club_id')) for c in json.load(open('config.json'))['cafes']]" || true

      - name: 카페 글 수집
        id: collect
        env:
          POKEWATCH_COOKIE: ${{ secrets.POKEWATCH_COOKIE }}
          POKEWATCH_DB: data/pokewatch.db
        run: |
          if [ -f config.json ]; then
            # 수집이 실패해도(네이버 차단·형식 변경 등) 지난 스냅샷으로 사이트는 유지한다.
            python3 -m pokewatch -v collect 2>&1 | tee 수집로그.txt \
              || echo "::warning::수집에 실패했습니다. 이전 데이터로 사이트를 만듭니다."
            # 실제 글이 들어왔으면 예제 데이터는 지운다. 섞여 있으면 시세가 엉망이 된다.
            python3 -m pokewatch clean-demo 2>&1 | tee -a 수집로그.txt || true
            # 실제 제목이 어떻게 해석되는지 남겨 둔다 (파서를 고칠 때 필요하다)
            python3 -m pokewatch sample -n 25 2>&1 | tee -a 수집로그.txt || true
            python3 -m pokewatch top -n 15 2>&1 | tee -a 수집로그.txt || true
          fi
          if [ ! -f data/pokewatch.db ]; then
            echo "::notice::데이터가 없어 예제 데이터를 넣습니다."
            python3 -m pokewatch demo --no-serve --count 400
          fi

      # 액션 로그는 잡음이 많아 확인이 번거롭다. 수집기 출력만 저장소에 남겨 둔다.
      # (경로 트리거에 수집로그.txt 가 없으므로 이 커밋이 다시 실행을 부르지는 않는다)
      - name: 수집 로그를 저장소에 남기기
        if: always()
        run: |
          [ -f 수집로그.txt ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 수집로그.txt
          git diff --cached --quiet || git commit -m "수집 로그 갱신 [skip ci]"
          # 수집이 도는 동안 main 이 움직였을 수 있다. 그대로 push 하면 거부되므로
          # 최신 main 위로 올린 뒤 올린다. (조용히 실패하면 로그가 낡은 채로 남는다)
          for attempt in 1 2 3; do
            git fetch origin main --quiet
            git rebase origin/main --quiet || { git rebase --abort || true; break; }
            if git push origin HEAD:main --quiet; then
              echo "수집 로그를 올렸습니다."
              exit 0
            fi
            sleep 5
          done
          echo "::warning::수집 로그를 올리지 못했습니다."

      - name: 정적 사이트 만들기
        env:
          POKEWATCH_DB: data/pokewatch.db
        run: |
          python3 -m pokewatch export -o site --days 180
          ls -la site

      - name: 시세 DB 저장 (다음 실행에서 추이를 잇기 위해)
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: pokewatch-db-${{ github.run_id }}

      # Cloudflare Pages 로 배포한다. 비공개 저장소도 무료로 서비스되므로
      # 저장소를 공개로 바꾸지 않아도 된다.
      - name: Cloudflare Pages 배포
        id: cf
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # pages.dev 주소는 전 세계에서 하나뿐이라 'pokewatch' 는 이미 누가 쓰고 있을 수
          # 있다. 그래서 깃허브 아이디를 붙여 겹치지 않게 한다.
          PROJECT: ${{ vars.CF_PAGES_PROJECT || format('pokewatch-{0}', github.repository_owner) }}
        run: |
          # Cloudflare 프로젝트 이름 규칙: 소문자·숫자·하이픈만
          PROJECT=$(echo "$PROJECT" | tr '[:upper:]' '[:lower:]' | tr -cs 'a-z0-9-' '-' | sed 's/^-*//;s/-*$//')
          echo "프로젝트 이름: $PROJECT"

          # 프로젝트가 없으면 만들고, 이미 있으면 그냥 넘어간다.
          npx --yes wrangler@3 pages project create "$PROJECT" \
            --production-branch main 2>/dev/null || true
          npx --yes wrangler@3 pages deploy site \
            --project-name "$PROJECT" --branch main

          echo "deployed=true" >> "$GITHUB_OUTPUT"
          echo "::notice::앱 주소 → https://$PROJECT.pages.dev"

      # Cloudflare 를 안 쓰면 깃허브 페이지로 올린다. 저장소가 공개면 설정 없이 바로 된다.
      - name: 깃허브 페이지용 파일 준비
        if: steps.cf.outputs.deployed != 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # 어느 쪽으로도 배포가 안 되더라도 결과물은 항상 받아볼 수 있게 남긴다.
      - name: 사이트 파일 보관
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site
          path: site
          retention-days: 14

  # Cloudflare 시크릿이 없을 때만 돈다. 저장소가 비공개면 깃허브 페이지가 막혀 있어
  # 실패하는데, 그건 정상이므로 전체를 빨간 X 로 만들지 않는다.
  pages:
    needs: collect
    if: needs.collect.outputs.cf_deployed != 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 페이지 기능을 자동으로 켜 보지만, GITHUB_TOKEN 에 권한이 없으면 실패한다.
      # 그때는 사용자가 Settings → Pages 에서 한 번 켜 줘야 한다.
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      # 여기엔 continue-on-error 를 두지 않는다. 두면 실패가 초록색으로 보여서
      # 배포가 안 됐는데도 성공한 줄 알게 된다 (실제로 그런 일이 있었다).
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: 결과 안내
        if: always()
        run: |
          if [ -n "${{ steps.deployment.outputs.page_url }}" ]; then
            echo "::notice::앱 주소 → ${{ steps.deployment.outputs.page_url }}"
          else
            echo "::error::깃허브 페이지가 아직 켜져 있지 않습니다."
            echo "Settings → Pages → Build and deployment → Source 를"
            echo "'GitHub Actions' 로 바꾼 뒤 이 워크플로를 다시 실행하세요."
            echo "→ https://github.com/${{ github.repository }}/settings/pages"
          fi
