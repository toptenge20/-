name: 시세 수집 후 사이트 갱신

# 컴퓨터를 켜 두지 않아도 클라우드가 대신 수집하고, 핸드폰은 주소만 열면 되게 한다.
on:
  schedule:
    # UTC 기준이다. 한국시간 오전 9시 / 오후 9시 (KST = UTC+9)
    - cron: "0 0,12 * * *"
  workflow_dispatch:        # 원할 때 손으로 실행
  push:
    branches: [main]
    paths:
      - "pokewatch/**"
      - ".github/workflows/collect.yml"

permissions:
  contents: read

# 앞 실행이 끝나지 않았으면 기다린다 (DB 커밋이 겹치지 않게)
concurrency:
  group: pokewatch-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 지난 실행에서 쌓아 둔 시세 DB를 복원한다. 이게 있어야 가격 '추이'가 이어진다.
      - name: 이전 시세 DB 복원
        uses: actions/cache/restore@v4
        with:
          path: data
          key: pokewatch-db-${{ github.run_id }}
          restore-keys: |
            pokewatch-db-

      - name: 설정 파일 준비
        env:
          POKEWATCH_CONFIG_JSON: ${{ secrets.POKEWATCH_CONFIG_JSON }}
        run: |
          if [ -n "$POKEWATCH_CONFIG_JSON" ]; then
            printf '%s' "$POKEWATCH_CONFIG_JSON" > config.json
            echo "저장소 시크릿의 설정을 사용합니다."
          elif [ -f config.json ]; then
            echo "저장소의 config.json 을 사용합니다."
          else
            echo "::warning::설정이 없어 예제 데이터로 사이트를 만듭니다."
          fi

      - name: 카페 글 수집
        id: collect
        env:
          POKEWATCH_COOKIE: ${{ secrets.POKEWATCH_COOKIE }}
          POKEWATCH_DB: data/pokewatch.db
        run: |
          if [ -f config.json ]; then
            # 수집이 실패해도(네이버 차단·형식 변경 등) 지난 스냅샷으로 사이트는 유지한다.
            python3 -m pokewatch -v collect || echo "::warning::수집에 실패했습니다. 이전 데이터로 사이트를 만듭니다."
          fi
          if [ ! -f data/pokewatch.db ]; then
            echo "::notice::데이터가 없어 예제 데이터를 넣습니다."
            python3 -m pokewatch demo --no-serve --count 400
          fi

      - name: 정적 사이트 만들기
        env:
          POKEWATCH_DB: data/pokewatch.db
        run: |
          python3 -m pokewatch export -o site --days 180
          ls -la site

      - name: 시세 DB 저장 (다음 실행에서 추이를 잇기 위해)
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: pokewatch-db-${{ github.run_id }}

      # Cloudflare Pages 로 배포한다. 비공개 저장소도 무료로 서비스되므로
      # 저장소를 공개로 바꾸지 않아도 된다.
      - name: Cloudflare Pages 배포
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ vars.CF_PAGES_PROJECT || 'pokewatch' }}
        run: |
          # 프로젝트가 없으면 만들고, 이미 있으면 그냥 넘어간다.
          npx --yes wrangler@3 pages project create "$PROJECT" \
            --production-branch main 2>/dev/null || true
          npx --yes wrangler@3 pages deploy site \
            --project-name "$PROJECT" --branch main

      - name: 배포 설정이 없을 때 안내
        if: env.CLOUDFLARE_API_TOKEN == ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          echo "::warning::CLOUDFLARE_API_TOKEN 시크릿이 없어 배포를 건너뜁니다."
          echo "아래 '사이트 파일' 아티팩트를 내려받아 직접 올려도 됩니다."

      # 배포를 안 하더라도 결과물은 항상 받아볼 수 있게 남긴다.
      - name: 사이트 파일 보관
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site
          path: site
          retention-days: 14
